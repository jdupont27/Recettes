name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurer les paquets
        run: dotnet restore RecipeApp.slnx

      - name: Compiler
        run: dotnet build RecipeApp.slnx --no-restore --configuration Release
