version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: RecipeApp.Web/Dockerfile
    ports:
      - "80:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=RecipeApp;Username=recipeapp;Password=${DB_PASSWORD};
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - Gemini__Model=gemini-2.5-flash
      - Gemini__VideoModel=gemini-3.5-flash-lite
      - AWS__BucketName=${AWS_BUCKET_NAME}
      - AWS__Region=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - Beta__CodeInvitation=${BETA_CODE_INVITATION}
      - Email__ResendApiKey=${EMAIL_RESEND_API_KEY}
      - Email__FromName=${EMAIL_FROM_NAME:-RecetteApp}
      - Email__AdminRelayAddress=${EMAIL_ADMIN_RELAY_ADDRESS}
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_uploads:/app/wwwroot/uploads
      - app_dataprotection:/root/.aspnet/DataProtection-Keys
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: RecipeApp
      POSTGRES_USER: recipeapp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Port exposé sur l'hôte pour un accès direct depuis un client SQL local (DBeaver, etc.)
    # Remettre en commentaire si vous n'en avez plus besoin.
    #ports:
    #  - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipeapp -d RecipeApp"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer:latest
    profiles: ["dev"]          # Ne démarre PAS avec docker-compose up (seulement avec --profile dev)
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  app_uploads:
  app_dataprotection:
